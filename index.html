<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kian feiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- set before first paint so the final layout never flashes -->
  <script>if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro');</script>
  <script src="js/intro.js" defer></script>
  <script src="js/coverflow.js" defer></script>
</head>
<body class="home">
  <main class="frame">
    <div class="stage" role="group" aria-label="Photos: drag, scroll or use the arrow keys to browse">
      <!-- the rest of the row, inner to outer on each side (js/coverflow.js) -->
      <div class="deck">
        <img class="card" draggable="false" data-side="left" src="assets/img/stack/lac-blanc.jpg" data-caption="Lac Blanc, Chamonix, France. September 2026." width="1400" height="1050" alt="A still alpine lake below Mont Blanc" fetchpriority="low">
        <img class="card" draggable="false" data-side="left" src="assets/img/stack/snowy-pines.jpg" data-caption="Steamboat, Colorado. February 2026." width="1050" height="1400" alt="Snow-covered pines under a deep blue sky" fetchpriority="low">
        <img class="card" draggable="false" data-side="left" src="assets/img/stack/night-sled.jpg" data-caption="Copper, Colorado. Opening weekend of Copper. November 2025." width="1400" height="1050" alt="Sledding at night in falling snow" fetchpriority="low">
        <img class="card" draggable="false" data-side="left" src="assets/img/stack/dunes.jpg" data-caption="Sand Dunes National Park, Colorado. October 2025." width="1050" height="1400" alt="A figure dancing on a sand dune under storm clouds" fetchpriority="low">
        <img class="card" draggable="false" data-side="left" src="assets/img/stack/yosemite-drive.jpg" data-caption="Yosemite, California." width="1400" height="1050" alt="Windblown hair out of a car window at dusk below granite cliffs" fetchpriority="low">
        <img class="card" draggable="false" data-side="left" src="assets/img/stack/fog-night.jpg" data-caption="Grizzly Peak, Berkeley." width="1050" height="1400" alt="Friends in the fog at dusk" fetchpriority="low">
        <img class="card" draggable="false" data-side="right" src="assets/img/stack/chamonix.jpg" data-caption="Aiguillette des Posettes, Chamonix, France. September 2026." width="1400" height="1050" alt="The Chamonix valley and Mont Blanc" fetchpriority="low">
        <img class="card" draggable="false" data-side="right" src="assets/img/stack/summit-crew.jpg" data-caption="Summit of Lac Blanc. September 2026." width="787" height="1400" alt="Four friends cheering on a rocky summit" fetchpriority="low">
        <img class="card" draggable="false" data-side="right" src="assets/img/stack/rock-gulls.jpg" data-caption="San Francisco, California. My friend Mikayla on a rock near the ocean. June 2024." width="1050" height="1400" alt="Someone on a sea rock with gulls overhead" fetchpriority="low">
        <img class="card" draggable="false" data-side="right" src="assets/img/stack/snowed-in.jpg" data-caption="Snowbird, Utah. Snowed 40 inches in 2 days! December 2025." width="787" height="1400" alt="A snowboard next to a snowed-in car" fetchpriority="low">
      </div>
      <img class="hero" data-caption="Jackson, Wyoming. Ran out of gas on the way to the city. Spring break 2026." src="assets/img/kian-2000.jpg" srcset="assets/img/kian-1200.jpg 1200w, assets/img/kian-2000.jpg 2000w, assets/img/kian-4000.jpg 4000w" sizes="100vw" alt="Kian taking a selfie in front of a snow-capped mountain range" fetchpriority="high" draggable="false">
      <p class="caption" aria-live="polite"></p>
    </div>

    <nav class="nav">
      <a class="nav-link" href="work/">work</a>
      <h1 class="name">kian feiz</h1>
      <a class="nav-link" href="projects/">projects</a>
    </nav>
  </main>
</body>
</html>
